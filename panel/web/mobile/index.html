<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7fbff">
  <title>鱼鱼小窝 · 手机聊天</title>
  <link rel="icon" href="/peer.png">
  <link rel="stylesheet" href="/mobile.css">
  <script defer src="/mobile.js"></script>
</head>
<body>
  <main class="phone">
    <header class="bar">
      <img id="peer-avatar" src="/peer.png" alt="" width="36" height="36">
      <div class="identity"><h1 id="peer-name">鱼鱼小窝</h1><p id="connection" role="status">手机聊天</p></div>
      <button id="leave" class="quiet" type="button" hidden>断开</button>
    </header>

    <form id="pair" class="pair">
      <label for="pair-code">配对码</label>
      <input id="pair-code" type="password" required autocomplete="off" autocapitalize="none" maxlength="44" spellcheck="false">
      <button id="pair-submit" class="primary" type="submit">配对</button>
      <p id="pair-error" class="status" role="status"></p>
    </form>

    <div id="chat" class="chat" hidden>
      <div id="stream" class="stream" aria-label="聊天记录">
        <button id="older" class="quiet" type="button" hidden>更早的消息</button>
        <p id="empty" class="empty" hidden>还没有聊天记录</p>
        <div id="messages" class="messages"></div>
      </div>
      <form id="compose" class="composer">
        <div id="draft" class="draft" hidden>
          <img id="draft-image" alt="" width="32" height="32">
          <span id="draft-name"></span>
          <button id="remove" type="button" class="icon" title="移除待发图片" aria-label="移除待发图片">×</button>
        </div>
        <p id="send-status" class="status" role="status"></p>
        <div class="compose-row">
          <button id="add" class="icon quiet" type="button" title="添加图片" aria-label="添加图片">＋</button>
          <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,.apng" hidden>
          <textarea id="text" rows="2" maxlength="50000" placeholder="写点什么…" aria-label="消息"></textarea>
          <button id="send" class="primary" type="submit" disabled>发送</button>
        </div>
      </form>
    </div>
  </main>
  <dialog id="viewer" aria-label="查看图片">
    <button id="close-image" type="button" class="icon quiet" title="关闭图片" aria-label="关闭图片">×</button>
    <img id="full-image" alt="聊天图片">
  </dialog>
</body>
</html>
